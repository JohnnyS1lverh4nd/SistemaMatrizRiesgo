; Producción. Se carga después de los .ini por defecto de la imagen.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

memory_limit = 256M
max_execution_time = 60

; Evidencias: hasta 5 archivos de 10 MB por seguimiento; importación: 5 MB.
upload_max_filesize = 12M
post_max_size = 64M
max_file_uploads = 10

; El código no cambia dentro del contenedor: no hace falta revisar marcas de tiempo.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

session.use_strict_mode = 1
date.timezone = America/Santo_Domingo
