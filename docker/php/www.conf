; Ajustes del pool de PHP-FPM para producción.
[www]
; Los logs de PHP-FPM y de los procesos van a la salida del contenedor (docker logs).
catch_workers_output = yes
decorate_workers_output = no

; Decenas de usuarios internos: pocos procesos bastan.
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; Las variables de entorno del contenedor (docker/produccion.env) llegan a Laravel.
clear_env = no
