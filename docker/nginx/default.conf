# Servidor web único (mismo dominio): la SPA de Nuxt en "/" y Laravel por
# FastCGI en las rutas de la API, de Sanctum y de Fortify.

# DNS interno de Docker. Con el destino en una variable, Nginx vuelve a
# resolver "app" cada 10 s: si el contenedor se recrea (actualización) y
# cambia de IP, no quedan peticiones apuntando a la IP vieja (502).
resolver 127.0.0.11 valid=10s ipv6=off;

# HTTP solo redirige a HTTPS (salvo la comprobación de salud interna).
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location = /up {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        set $php app:9000;
        fastcgi_pass $php;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # Certificado de la institución (ver docs/despliegue.md).
    ssl_certificate     /etc/nginx/certs/servidor.crt;
    ssl_certificate_key /etc/nginx/certs/servidor.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    server_tokens off;
    # Evidencias: hasta 5 archivos de 10 MB (coincide con post_max_size de PHP).
    client_max_body_size 64m;

    # Cabeceras de seguridad (también en las respuestas de error).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /usr/share/nginx/html;

    # --- Laravel ----------------------------------------------------------------
    location @laravel {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTPS on;
        set $php app:9000;
        fastcgi_pass $php;
        fastcgi_read_timeout 120s;
        # Exportaciones (PDF/Excel) e importaciones pueden tardar unos segundos.
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
    }

    location ^~ /api/      { try_files /nonexistent @laravel; }
    location ^~ /sanctum/  { try_files /nonexistent @laravel; }
    location = /up         { try_files /nonexistent @laravel; }
    location = /logout          { try_files /nonexistent @laravel; }
    location = /forgot-password { try_files /nonexistent @laravel; }
    location = /reset-password  { try_files /nonexistent @laravel; }
    location = /user/password   { try_files /nonexistent @laravel; }

    # /login: la página es de Nuxt (GET) y la acción es de Fortify (POST).
    location = /login {
        error_page 418 = @laravel;
        if ($request_method = POST) {
            return 418;
        }
        try_files /index.html =404;
    }

    # --- SPA de Nuxt (archivos estáticos) ---------------------------------------
    # Recursos con hash en el nombre: se pueden guardar en caché un año.
    location ^~ /_nuxt/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Cualquier otra ruta la resuelve el router de Nuxt (index.html sin caché).
    location / {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }
}
